
name: nepal_sathi_frontend
description: "Nepali Sathi - Speak and write Nepali easily."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^4.0.3
  record: ^7.2.0
  path_provider: ^2.1.6
  http: ^1.6.0
  share_plus: ^13.3.1
  just_audio: ^0.10.6
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#16845B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Native splash screen configuration
flutter_native_splash:
  android: true
  ios: false

  # Older Android versions
  background_image: assets/images/splash_image.png
  fullscreen: true

  # Android 12 and newer (including Android 14)
  android_12:
    color: "#16845B"
    image: assets/images/splash_logo.png

# Flutter configuration
flutter:
  uses-material-design: true

  assets:
    - assets/images/splash_image.png
    - assets/images/splash_logo.png
    - assets/icon/app_icon.png
